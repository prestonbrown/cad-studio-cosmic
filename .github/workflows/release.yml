# Builds the release packages when a v* tag is pushed and attaches them to the
# GitHub Release. A manual run (workflow_dispatch) builds and checks the
# packages on any branch without releasing. The AUR package is published by
# hand (see packaging/aur/PKGBUILD).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libxkbcommon-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libinput-dev libudev-dev libseat-dev libgbm-dev libegl-dev \
            lintian desktop-file-utils appstream imagemagick squashfs-tools

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo pkgid -p app | sed 's/.*[@#]//')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != crate version $version"; exit 1; }

      - name: App test suite
        run: cargo test -p app

      - name: Tools
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Packages and package check
        run: scripts/rig/package-check.sh

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/*.deb dist/*.AppImage dist/*.tar.gz dist/SHA256SUMS
