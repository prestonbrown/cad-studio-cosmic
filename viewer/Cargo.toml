[package]
name = "viewer"
description = "CAD Studio 3D viewer: camera math, tools, wgpu renderer (iced adapter only)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
iced.workspace = true
engine = { path = "../engine" }
pollster = "0.4"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
resvg = "0.45"
# the WGSL the pipelines actually run must parse headless: naga is already
# in the graph (wgpu's own frontend), pinned to the same version
naga = { version = "28.0.0", features = ["wgsl-in"] }
