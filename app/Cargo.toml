[package]
name = "app"
description = "CAD Studio for COSMIC"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "cad-studio"
path = "src/main.rs"

[dependencies]
libcosmic.workspace = true
engine = { path = "../engine" }
viewer = { path = "../viewer" }
# the pane's pose wiring writes per-part translation matrices (the
# arrangement offsets) — the same pin the viewer crate stages with
glam.workspace = true
uuid.workspace = true
time.workspace = true
# the system time zone for displayed timestamps (`time` cannot read the
# local offset once the process has threads); lopdf already links chrono,
# so this adds no new copy.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json.workspace = true
thiserror.workspace = true
# the engine bridge drives tokio channels (TurnHandle.events is a tokio
# receiver) and spawns its driver on the runtime cosmic runs on; libcosmic
# already links tokio (iced/tokio), so this adds no new copy.
tokio = { workspace = true, features = ["signal"] }
# resvg matches the iced fork's own pin (0.45) so the tree carries one copy;
# image (png) decodes the schematic.png fallback raster; jpeg joins for the
# chat attachment thumbnails (the picker's two realistic image formats).
resvg = "0.45"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
] }
# Inline-only markdown for the chat pane; parser only — no html/escape/cli.
pulldown-cmark = { version = "0.13.4", default-features = false }

# The shell task: portal choosers (ashpd), DBus reveal (zbus), and the
# fluent scaffold (i18n-embed/rust-embed at libcosmic's own pins so the
# tree keeps one copy of each). ashpd's default feature set is tokio.
ashpd = "0.12"
zbus = { version = "5.15", default-features = false, features = ["tokio"] }
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
rust-embed = "8.11.0"
# the export portal's default folder (upstream's Downloads directory,
# ProjectPanels.swift:28); already in the tree at cosmic-config's pin
dirs = "6"

[dev-dependencies]
# the slice's offscreen screenshot test drives the viewer's surfaceless
# harness directly (render_headless.rs pattern)
wgpu.workspace = true
# the export test reads the written archive back (the replace-before-zip
# law's assertion side); the engine already pins the version workspace-wide
zip.workspace = true
# the packaging test parses the metainfo XML (engine's own pin — the tree
# carries one copy)
quick-xml.workspace = true

# `cargo deb -p app` after `scripts/package/stage.sh dist/stage`: the staged
# tree carries the desktop entry and metainfo rendered from
# resources/packaging/ (the same templates `just install` renders) and the
# hicolor icons. scripts/package/build.sh runs both steps.
[package.metadata.deb]
name = "cad-studio-cosmic"
maintainer = "Preston Brown <pbrown@brown-house.net>"
copyright = "2024 Filippo Finke, 2026 Preston Brown"
license-file = ["../LICENSE", "0"]
section = "graphics"
priority = "optional"
depends = "$auto, libvulkan1, libwayland-client0, libfontconfig1, zip, xdg-utils"
recommends = "python3-venv, mesa-vulkan-drivers, libegl1, libxkbcommon-x11-0"
extended-description = """\
Describe a part, get a printable model. CAD Studio drives your locally \
installed Claude Code (or Codex) and build123d to turn a description into a \
printable 3D model and its technical drawing, on the COSMIC desktop."""
changelog = "../dist/stage/changelog"
assets = [
    ["target/release/cad-studio", "usr/bin/cad-studio", "755"],
    ["../dist/stage/usr/share/applications/net.brownhouse.CadStudio.desktop", "usr/share/applications/", "644"],
    ["../dist/stage/usr/share/metainfo/net.brownhouse.CadStudio.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../dist/stage/usr/share/icons/hicolor/128x128/apps/net.brownhouse.CadStudio.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../dist/stage/usr/share/icons/hicolor/256x256/apps/net.brownhouse.CadStudio.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../dist/stage/usr/share/icons/hicolor/512x512/apps/net.brownhouse.CadStudio.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]
